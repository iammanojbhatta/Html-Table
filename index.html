<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
/* === Responsive patch — added 2026: fluid media + mobile layout === */
img,video,canvas,svg,table{max-width:100%;height:auto}
@media (max-width:768px){
  body{padding:10px}
  .container,[class*="container"],.wrapper,main,section{width:100%!important;max-width:100%!important}
  h1{font-size:1.55rem}h2{font-size:1.25rem}
  table{display:block;overflow-x:auto}
}
</style>
</head>

<body>
    <table border="1" cellpadding="5" cellspacing="5">
        <tr>
            <td colspan="2">Product</td>
            <td>Price</td>
            <td>Stock</td>
        </tr>
        <tr>
            <td rowspan="2">Gadget A<br>(Model x)</td>
            <td>Color: Red</td>
            <td>$49.99</td>
            <td>In Stock</td>
        </tr>
        <tr>
            <td>Color: Blue</td>
            <td>$49.99</td>
            <td>Low Stock</td>
        </tr>
        <tr>
            <td colspan="4">Free shipping on order over $100</td>
        </tr>
        <tr>
            <td colspan="2">Totel items: </td>
            <td colspan="2]">2</td>
        </tr>
    </table>
</body>

</html>
